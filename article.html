<!DOCTYPE html>
<html lang="sl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio MARS - Snemalni Studio Trebnje</title>
    <meta name="description"
        content="Profesionalni snemalni studio v Trebnjem. Snemanje, mix, mastering, video produkcija.">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #0a0a0a;
        }

        .bg-pattern {
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.8;
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: black;
            opacity: 0.3;
        }

        .logo-offset {
            margin-left: 0;
        }

        @media (min-width: 1024px) {
            .logo-offset {
                margin-left: -4rem;
            }
        }

        .content {
            position: relative;
            z-index: 10;
        }

        .slider-item {
            transition: opacity 1s;
        }

        /* Reveal Animations */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .reveal-left {
            opacity: 0;
            transform: translateX(-50px);
            transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .reveal-left.active {
            opacity: 1;
            transform: translateX(0);
        }

        .reveal-right {
            opacity: 0;
            transform: translateX(50px);
            transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .reveal-right.active {
            opacity: 1;
            transform: translateX(0);
        }

        /* Image Zoom Styles */
        .article-content img {
            cursor: zoom-in;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .article-content img:hover {
            transform: scale(1.01);
            filter: brightness(1.1);
        }
    </style>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/favicon.png">
</head>

<body>
    <div class="bg-pattern"></div>
    <div class="bg-overlay"></div>

    <div class="content">
        <!-- Header -->
        <header class="bg-black bg-opacity-90 backdrop-blur-md shadow-lg sticky top-0 z-50 border-b border-gray-800">
            <div class="max-w-5xl mx-auto px-4 py-4">
                <div class="flex justify-between items-center">
                    <a href="index.html" class="flex items-center space-x-3 logo-offset">
                        <div class="relative w-14 h-14">
                            <div class="absolute inset-0 bg-orange-400 rounded-full blur-md opacity-40"></div>
                            <img src="https://i.ibb.co/k2dyLNwQ/mars3.png" alt="Studio MARS Logo"
                                class="relative w-14 h-14 rounded-full object-cover"
                                style="filter: drop-shadow(4px 3px 4px rgba(0,0,0,0.5));">
                        </div>
                        <div>
                            <h1 class="text-sm font-medium text-white tracking-wider" style="margin-left: -0.5em;">
                                SNEMALNI</h1>
                            <h2 class="text-xl font-bold">
                                <span class="text-white">STUDIO </span>
                                <span class="text-[#EB462F]">MARS</span>
                            </h2>
                        </div>
                    </a>
                    <nav class="hidden lg:flex space-x-0">
                        <a href="index.html"
                            class="px-2 py-2 text-sm font-medium text-gray-300 hover:text-[#EB462F]">DOMOV</a>
                        <a href="studio.html"
                            class="px-2 py-2 text-sm font-medium text-gray-300 hover:text-[#EB462F]">STUDIO</a>
                        <a href="oprema.html"
                            class="px-2 py-2 text-sm font-medium text-gray-300 hover:text-[#EB462F]">OPREMA</a>
                        <a href="bio.html"
                            class="px-2 py-2 text-sm font-medium text-gray-300 hover:text-[#EB462F]">BIO</a>
                        <a href="ponudba.html"
                            class="px-2 py-2 text-sm font-medium text-gray-300 hover:text-[#EB462F]">PONUDBA</a>
                        <a href="video.html"
                            class="px-2 py-2 text-sm font-medium text-gray-300 hover:text-[#EB462F]">VIDEO</a>
                        <a href="projekti.html"
                            class="px-2 py-2 text-sm font-medium text-gray-300 hover:text-[#EB462F]">PROJEKTI</a>
                        <a href="galerija.html"
                            class="px-2 py-2 text-sm font-medium text-gray-300 hover:text-[#EB462F]">GALERIJA</a>
                        <a href="blog.html"
                            class="px-2 py-2 text-sm font-medium text-[#EB462F] hover:text-[#EB462F]">NOVICE</a>
                        <a href="kontakt.html"
                            class="px-2 py-2 text-sm font-medium text-gray-300 hover:text-[#EB462F]">KONTAKT</a>

                    <button id="menu-btn" class="lg:hidden p-2 text-gray-300">

                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                </div>
                <div id="mobile-menu" class="lg:hidden hidden bg-gray-900 mt-2 rounded">
                    <a href="index.html" class="block px-4 py-2 text-gray-300 hover:bg-gray-800">DOMOV</a>
                    <a href="studio.html" class="block px-4 py-2 text-gray-300 hover:bg-gray-800">STUDIO</a>
                    <a href="oprema.html" class="block px-4 py-2 text-gray-300 hover:bg-gray-800">OPREMA</a>
                    <a href="bio.html" class="block px-4 py-2 text-gray-300 hover:bg-gray-800">BIO</a>
                    <a href="ponudba.html" class="block px-4 py-2 text-gray-300 hover:bg-gray-800">PONUDBA</a>
                    <a href="video.html" class="block px-4 py-2 text-gray-300 hover:bg-gray-800">VIDEO</a>
                    <a href="projekti.html" class="block px-4 py-2 text-gray-300 hover:bg-gray-800">PROJEKTI</a>
                    <a href="galerija.html" class="block px-4 py-2 text-gray-300 hover:bg-gray-800">GALERIJA</a>
                    <a href="blog.html" class="block px-4 py-2 text-[#EB462F] hover:bg-gray-800">NOVICE</a>
                    <a href="kontakt.html" class="block px-4 py-2 text-gray-300 hover:bg-gray-800">KONTAKT</a>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-4xl mx-auto px-4 py-8">
            <div class="mb-6">
                <a href="blog.html"
                    class="text-[#EB462F] hover:text-white transition-colors flex items-center space-x-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    <span>Nazaj na novice</span>
                </a>
            </div>

            <!-- Article Content -->
            <article id="article-container"
                class="reveal bg-gray-900 bg-opacity-80 backdrop-blur-sm rounded-xl overflow-hidden border border-gray-800">
                <!-- Injected via JS -->
                <div class="p-12 text-center text-gray-400">Nalaganje...</div>
            </article>
        </main>

        <script src="js/blog-data.js"></script>
        <script>
            // Article Logic
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');
            const container = document.getElementById('article-container');

            if (articleId) {
                const post = getArticleById(articleId);
                if (post) {
                    document.title = `${post.title} - Studio MARS`;

                    container.innerHTML = `
                        <div class="h-64 md:h-96 w-full relative">
                            <img src="${post.image}" alt="${post.title}" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-gradient-to-t from-gray-900 to-transparent"></div>
                            <div class="absolute bottom-0 left-0 p-6 md:p-10 w-full">
                                <div class="flex items-center space-x-4 mb-4">
                                     <span class="bg-[#EB462F] text-white text-xs font-bold px-2 py-1 rounded shadow">${post.tags[0]}</span>
                                     <div class="text-gray-300 text-sm flex items-center space-x-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                                        <span>${post.date}</span>
                                    </div>
                                    <div class="text-gray-300 text-sm flex items-center space-x-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                        <span>${post.readTime}</span>
                                    </div>
                                </div>
                                <h1 class="text-3xl md:text-5xl font-bold text-white leading-tight max-w-4xl">${post.title}</h1>
                            </div>
                        </div>
                        
                        <div class="p-6 md:p-10">
                            <!-- Injected Content -->
                            <div class="prose prose-invert prose-lg max-w-none text-gray-300 article-content">
                                <p class="lead text-xl text-white font-medium mb-8">${post.excerpt}</p>
                                ${post.content}
                            </div>

                            <!-- Share / Tags -->
                            <div class="mt-12 pt-8 border-t border-gray-800 flex flex-wrap gap-2">
                                ${post.tags.map(tag => `<span class="bg-gray-800 text-gray-300 px-3 py-1 rounded-full text-sm">#${tag}</span>`).join('')}
                            </div>
                        </div>
                    `;
                } else {
                    container.innerHTML = `<div class="p-12 text-center text-red-500">Novica ni obstaja.</div>`;
                }
            } else {
                window.location.href = 'blog.html';
            }
        </script>

        <!-- Footer -->
        <footer class="bg-black bg-opacity-90 border-t border-gray-800 mt-12">
            <div class="max-w-5xl mx-auto px-4 py-6">
                <div class="flex flex-col items-center space-y-4">
                    <div class="flex space-x-4">
                        <a href="https://www.facebook.com/SnemalniStudioMars" target="_blank"
                            class="w-10 h-10 bg-blue-600 hover:bg-blue-700 rounded-full flex items-center justify-center transition-all transform hover:scale-110">
                            <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z">
                                </path>
                            </svg>
                        </a>
                        <a href="https://soundcloud.com/studiomars31" target="_blank"
                            class="w-10 h-10 bg-orange-500 hover:bg-orange-600 rounded-full flex items-center justify-center transition-all transform hover:scale-110">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3">
                                </path>
                            </svg>
                        </a>
                        <a href="mailto:snemalni.studio.mars@gmail.com"
                            class="w-10 h-10 bg-[#EB462F] hover:bg-[#C83C28] rounded-full flex items-center justify-center transition-all transform hover:scale-110">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                                </path>
                            </svg>
                        </a>
                    </div>
                    <p class="text-sm text-gray-400">© 2008 by Studio Mars</p>
                </div>
            </div>
        </footer>
    </div>

    <script>
        // Main Slider
        // Mobile menu
        document.getElementById('menu-btn').onclick = () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        };

        // Scroll Reveal Animation
        function revealOnScroll() {
            const reveals = document.querySelectorAll('.reveal, .reveal-left, .reveal-right');

            reveals.forEach(element => {
                const windowHeight = window.innerHeight;
                const elementTop = element.getBoundingClientRect().top;
                const revealPoint = 100;

                if (elementTop < windowHeight - revealPoint) {
                    element.classList.add('active');
                }
            });
        }

        window.addEventListener('scroll', revealOnScroll);
        window.addEventListener('load', () => {
            revealOnScroll();

            // Lightbox Logic
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const articleContainer = document.getElementById('article-container');

            if (articleContainer && lightbox && lightboxImg) {
                articleContainer.addEventListener('click', (e) => {
                    // Find the closest image within the article content
                    const img = e.target.closest('.article-content img');
                    if (img) {
                        lightboxImg.src = img.src;
                        lightbox.classList.remove('hidden');
                        lightbox.classList.add('flex');
                        setTimeout(() => {
                            lightboxImg.classList.remove('scale-95', 'opacity-0');
                            lightboxImg.classList.add('scale-100', 'opacity-100');
                        }, 10);
                        document.body.style.overflow = 'hidden';
                    }
                });

                lightbox.onclick = () => {
                    lightboxImg.classList.remove('scale-100', 'opacity-100');
                    lightboxImg.classList.add('scale-95', 'opacity-0');
                    setTimeout(() => {
                        lightbox.classList.add('hidden');
                        lightbox.classList.remove('flex');
                        document.body.style.overflow = '';
                    }, 300);
                };
            }
        });
    </script>

    <!-- Lightbox Modal -->
    <div id="lightbox"
        class="fixed inset-0 z-[100] bg-black bg-opacity-95 hidden items-center justify-center cursor-pointer backdrop-blur-md transition-all duration-300">
        <div class="absolute top-6 right-6 text-white hover:text-[#EB462F] transition-colors p-2 z-[110]">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </div>
        <img id="lightbox-img" src="" alt="Zoomed view"
            class="max-w-[95%] max-h-[95%] object-contain rounded-lg shadow-2xl transform transition-all duration-300 scale-95 opacity-0">
    </div>
</body>

</html>
