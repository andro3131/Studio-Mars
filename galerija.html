    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #0a0a0a;
        }

        .bg-pattern {
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.8;
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: black;
            opacity: 0.3;
        }

        .logo-offset {
            margin-left: 0;
        }

        @media (min-width: 1024px) {
            .logo-offset {
                margin-left: -4rem;
            }
        }

        .content {
            position: relative;
            z-index: 10;
        }

        /* Simple Fixed Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        @media (min-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .gallery-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .gallery-item {
            aspect-ratio: 1 / 1;
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .gallery-item.hidden-item {
            display: none;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.95);
            align-items: center;
            justify-content: center;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
        }

        /* Reveal Animations */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .reveal-left {
            opacity: 0;
            transform: translateX(-50px);
            transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .reveal-left.active {
            opacity: 1;
            transform: translateX(0);
        }

        .reveal-right {
            opacity: 0;
            transform: translateX(50px);
            transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .reveal-right.active {
            opacity: 1;
            transform: translateX(0);
        }
    </style>

    <script>
        // Mobile menu
        document.getElementById('menu-btn').onclick = () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        };

        // Pagination - Load More functionality
        const IMAGES_PER_PAGE = 24;
        let visibleCount = 0;
        const allItems = document.querySelectorAll('.gallery-item');
        const totalImages = allItems.length;
        const loadMoreBtn = document.getElementById('load-more-btn');
        const counter = document.getElementById('image-counter');

        function updateCounter() {
            counter.textContent = `Prikazanih ${Math.min(visibleCount, totalImages)} od ${totalImages} fotografij`;
        }

        function showMoreImages() {
            const endIndex = Math.min(visibleCount + IMAGES_PER_PAGE, totalImages);
            for (let i = visibleCount; i < endIndex; i++) {
                const item = allItems[i];
                const img = item.querySelector('img');
                // Restore src from data-src if it was deferred
                if (img.dataset.lazySrc) {
                    img.src = img.dataset.lazySrc;
                    delete img.dataset.lazySrc;
                }
                item.classList.remove('hidden-item');
            }
            visibleCount = endIndex;
            updateCounter();

            if (visibleCount >= totalImages) {
                loadMoreBtn.style.display = 'none';
            }
        }

        // Initially: defer loading for images beyond first batch
        allItems.forEach((item, index) => {
            if (index >= IMAGES_PER_PAGE) {
                const img = item.querySelector('img');
                // Only move src if it actually points to an external image
                if (img.src && (img.src.startsWith('http') || img.src.includes('ibb.co')) && !img.dataset.lazySrc) {
                    img.dataset.lazySrc = img.src;
                    img.removeAttribute('src');
                }
            }
            item.classList.add('hidden-item');
        });

        // Show first batch (these have normal src, will load immediately)
        showMoreImages();

        loadMoreBtn.onclick = showMoreImages;

        // Lightbox functions
        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        // Scroll Reveal Animation
        function revealOnScroll() {
            const reveals = document.querySelectorAll('.reveal, .reveal-left, .reveal-right');

            reveals.forEach(element => {
                const windowHeight = window.innerHeight;
                const elementTop = element.getBoundingClientRect().top;
                const revealPoint = 100;

                if (elementTop < windowHeight - revealPoint) {
                    element.classList.add('active');
                }
            });
        }

        window.addEventListener('scroll', revealOnScroll);
        window.addEventListener('load', revealOnScroll);

        // Close lightbox with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>
