<!DOCTYPE html>
<html lang="sl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekti - STUDIO MARS</title>
    <meta name="description" content="Projekti STUDIO MARS - pregled vseh studijskih projektov od leta 2008.">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #0a0a0a;
        }

        .bg-pattern {
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.8;
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: black;
            opacity: 0.3;
        }

        .logo-offset {
            margin-left: 0;
        }

        @media (min-width: 1024px) {
            .logo-offset {
                margin-left: -4rem;
            }
        }

        .content {
            position: relative;
            z-index: 10;
        }

        .year-btn {
            transition: all 0.2s ease;
        }

        .year-btn:hover {
            background: rgba(235, 70, 47, 0.2);
        }

        .year-btn.active {
            background: rgba(235, 70, 47, 0.3);
            border-left: 3px solid #EB462F;
        }

        .project-item {
            transition: all 0.2s ease;
        }

        .project-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        audio {
            height: 32px;
        }

        audio::-webkit-media-controls-panel {
            background: #1f2937;
        }

        /* Mobile Accordion Styles */
        .accordion-header {
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .accordion-header:hover {
            background: rgba(235, 70, 47, 0.2);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .accordion-content.open {
            max-height: none;
        }

        .accordion-arrow {
            transition: transform 0.3s ease;
        }

        .accordion-arrow.open {
            transform: rotate(180deg);
        }

        @media (min-width: 1024px) {
            .mobile-accordion-wrapper {
                display: none !important;
            }

            .desktop-content-wrapper {
                display: block !important;
            }
        }

        @media (max-width: 1023px) {
            .mobile-accordion-wrapper {
                display: block !important;
            }

            .desktop-content-wrapper {
                display: none !important;
            }
        }

        /* Reveal Animations */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .reveal-left {
            opacity: 0;
            transform: translateX(-50px);
            transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .reveal-left.active {
            opacity: 1;
            transform: translateX(0);
        }

        .reveal-right {
            opacity: 0;
            transform: translateX(50px);
            transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .reveal-right.active {
            opacity: 1;
            transform: translateX(0);
        }
    </style>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/favicon.png">
    <script src="js/project-data.js"></script>
    <link rel="preconnect" href="https://i.ibb.co">
</head>

<body>

                        <a href="bio.html"

                        <a href="blog.html"

                    <button id="menu-btn" class="lg:hidden p-2 text-gray-300">

                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

                    </button>
                </div>
                <div id="mobile-menu" class="lg:hidden hidden bg-gray-900 mt-2 rounded">
                    <a href="index.html" class="block px-4 py-2 text-gray-300 hover:bg-gray-800">DOMOV</a>
                    <a href="studio.html" class="block px-4 py-2 text-gray-300 hover:bg-gray-800">STUDIO</a>
                    <a href="oprema.html" class="block px-4 py-2 text-gray-300 hover:bg-gray-800">OPREMA</a>
                    <a href="bio.html" class="block px-4 py-2 text-gray-300 hover:bg-gray-800">BIO</a>
                    <a href="ponudba.html" class="block px-4 py-2 text-gray-300 hover:bg-gray-800">PONUDBA</a>
                    <a href="video.html" class="block px-4 py-2 text-gray-300 hover:bg-gray-800">VIDEO</a>
                    <a href="projekti.html" class="block px-4 py-2 text-[#EB462F] hover:bg-gray-800">PROJEKTI</a>
                    <a href="galerija.html" class="block px-4 py-2 text-gray-300 hover:bg-gray-800">GALERIJA</a>
                    <a href="blog.html" class="block px-4 py-2 text-gray-300 hover:bg-gray-800">NOVICE</a>
                    <a href="kontakt.html" class="block px-4 py-2 text-gray-300 hover:bg-gray-800">KONTAKT</a>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-5xl mx-auto px-4 py-8">
            <!-- Title with underline -->
            <div class="reveal-left mb-8">
                <h1 class="text-2xl font-medium text-white mb-2">Projekti</h1>
                <div class="w-16 h-1 bg-[#EB462F] rounded-full"></div>
            </div>

            <!-- Main Layout: Sidebar + Content -->
            <div class="flex flex-col lg:flex-row gap-6">

                <div class="reveal-left hidden lg:block lg:w-24 flex-shrink-0">
                    <div
                        class="bg-gray-900 bg-opacity-80 backdrop-blur-sm rounded-xl border border-gray-800 overflow-hidden lg:sticky lg:top-24">
                        <div id="year-sidebar" class="p-1">

                </div>

                <!-- Projects Content -->
                <div class="reveal-right flex-1">
                    <!-- Mobile Accordion Navigation -->

                    <!-- Desktop Content Wrapper -->

        <!-- Footer -->

                        </a>
                        <a href="https://soundcloud.com/studiomars31/stari-mlin" target="_blank"

                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3">

                            </svg>
                        </a>
                        <a href="mailto:studiomars@siol.net"
                            class="w-10 h-10 bg-[#EB462F] hover:bg-[#C83C28] rounded-full flex items-center justify-center transition-all transform hover:scale-110">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">

                            </svg>
                        </a>
                    </div>
                    <p class="text-sm text-gray-400">© 2008 by STUDIO Mars</p>

    </div>

    <script>
        // Mobile menu
        document.getElementById('menu-btn').onclick = () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        };

        // Data-driven rendering
        function createYearButtons() {
            const sidebar = document.getElementById('year-sidebar');
            if (!sidebar) return;
            const years = Object.keys(projectData).sort((a, b) => b - a);

            sidebar.innerHTML = years.map(year => `
                <button onclick="showYear(${year})"
                    class="year-btn w-full text-left px-3 py-1 text-sm font-medium ${year === '2026' ? 'active text-[#EB462F]' : 'text-gray-400'} rounded"
                    data-year="${year}">
                    ${year}
                </button>
            `).join('');
        }

        function createMobileAccordions() {
            const wrapper = document.getElementById('mobile-accordion');
            if (!wrapper) return;
            const years = Object.keys(projectData).sort((a, b) => b - a);

            wrapper.innerHTML = years.map(year => `
                <div class="accordion-item" data-accordion-year="${year}">
                    <div class="accordion-header bg-gray-900 bg-opacity-80 backdrop-blur-sm rounded-lg px-4 py-3 border border-gray-800 flex justify-between items-center"
                        onclick="toggleAccordion(${year})">
                        <span class="text-lg font-medium ${year === '2026' ? 'text-[#EB462F]' : 'text-white'}">${year}</span>
                        <svg class="accordion-arrow w-5 h-5 ${year === '2026' ? 'text-[#EB462F] open' : 'text-gray-400'}" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </div>
                    <div class="accordion-content ${year === '2026' ? 'open' : ''}" id="accordion-${year}"></div>
                </div>
            `).join('');
        }

        function renderProjectItems(year) {
            const data = projectData[year];
            if (!data) return '<div class="p-6 text-gray-400">Ni podatkov za to leto.</div>';

            let html = `
                <div class="bg-gray-900 bg-opacity-80 backdrop-blur-sm rounded-xl p-6 border border-gray-800 ${data.videos.length > 0 || (data.audio && data.audio.length > 0) ? 'mb-6' : ''}">
                    <h2 class="text-xl font-medium text-white mb-4">${year}</h2>
                    <div class="space-y-0">
                        ${data.list.map(item => `
                            <div class="project-item px-2 py-0 rounded text-sm">
                                <span class="text-[#EB462F]">${item.artist}</span>
                                <span class="text-gray-400"> – ${item.desc}</span>
                                ${item.status === 'work' ? '<span class="text-yellow-500 text-xs">*</span>' : ''}
                            </div>
                        `).join('')}
                    </div>
                    ${data.list.some(i => i.status === 'work') ? '<p class="text-gray-500 text-xs mt-4">* projekt v delu</p>' : ''}
                </div>
            `;

            if (data.audio && data.audio.length > 0) {
                html += `
                    <div class="bg-gray-900 bg-opacity-80 backdrop-blur-sm rounded-xl p-6 border border-gray-800 mb-6">
                        <h3 class="text-lg font-medium text-white mb-4">Izbrani posnetki</h3>
                        <div class="space-y-4">
                            ${data.audio.map(path => `
                                <div class="rounded-lg overflow-hidden">
                                    <iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay"
                                        src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/${path}&color=%23eb462f&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false" loading="lazy"></iframe>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            if (data.videos && data.videos.length > 0) {
                html += `
                    <div class="bg-gray-900 bg-opacity-80 backdrop-blur-sm rounded-xl p-6 border border-gray-800">
                        <h3 class="text-lg font-medium text-white mb-4">Video posnetki</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${data.videos.map(id => `
                                <div class="aspect-video rounded-lg overflow-hidden">
                                    <iframe class="w-full h-full" src="https://www.youtube.com/embed/${id}"
                                        frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                        allowfullscreen loading="lazy"></iframe>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            return html;
        }

        function showYear(year) {
            // Remove active class from all buttons
            document.querySelectorAll('.year-btn').forEach(btn => {
                btn.classList.remove('active', 'text-[#EB462F]');
                btn.classList.add('text-gray-400');
            });

            // Set active button
            const activeBtn = document.querySelector(`[data-year="${year}"]`);
            if (activeBtn) {
                activeBtn.classList.add('active', 'text-[#EB462F]');
                activeBtn.classList.remove('text-gray-400');
            }

            // Render content
            const desktopContent = document.getElementById('desktop-content');
            if (desktopContent) {
                desktopContent.innerHTML = renderProjectItems(year);
            }

            // Re-reveal animations if needed
            revealOnScroll();
        }

        function toggleAccordion(year) {
            const accordionItem = document.querySelector(`[data-accordion-year="${year}"]`);
            const content = document.getElementById('accordion-' + year);
            const arrow = accordionItem.querySelector('.accordion-arrow');
            const header = accordionItem.querySelector('.accordion-header span');

            const isOpen = content.classList.contains('open');

            // Close all
            document.querySelectorAll('.accordion-item').forEach(item => {
                item.querySelector('.accordion-content').classList.remove('open');
                const itemArrow = item.querySelector('.accordion-arrow');
                itemArrow.classList.remove('open', 'text-[#EB462F]');
                itemArrow.classList.add('text-gray-400');
                const itemHeader = item.querySelector('.accordion-header span');
                itemHeader.classList.remove('text-[#EB462F]');
                itemHeader.classList.add('text-white');
            });

            if (!isOpen) {
                content.classList.add('open');
                arrow.classList.add('open', 'text-[#EB462F]');
                arrow.classList.remove('text-gray-400');
                header.classList.add('text-[#EB462F]');
                header.classList.remove('text-white');

                // Populate content
                content.innerHTML = renderProjectItems(year);
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function () {
            createYearButtons();
            createMobileAccordions();

            // Show initial year (2026)
            showYear(2026);

            const firstAccordion = document.getElementById('accordion-2026');
            if (firstAccordion) {
                firstAccordion.innerHTML = renderProjectItems(2026);
            }

            revealOnScroll();
        });

        // Scroll Reveal Animation
        function revealOnScroll() {
            const reveals = document.querySelectorAll('.reveal, .reveal-left, .reveal-right');

            reveals.forEach(element => {
                const windowHeight = window.innerHeight;
                const elementTop = element.getBoundingClientRect().top;
                const revealPoint = 100;

                if (elementTop < windowHeight - revealPoint) {
                    element.classList.add('active');
                }
            });
        }

        window.addEventListener('scroll', revealOnScroll);
        window.addEventListener('load', revealOnScroll);
    </script>
</body>
