<!DOCTYPE html>

<head>

        content="Profesionalni snemalni studio v Trebnjem. Snemanje, mix, mastering, video produkcija.">

    <style>
        body {
            background: #0a0a0a;
        }

        .bg-pattern {
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.8;
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: black;
            opacity: 0.3;
        }

        .logo-offset {
            margin-left: 0;
        }

        @media (min-width: 1024px) {
            .logo-offset {
                margin-left: -4rem;
            }
        }

        .content {
            position: relative;
            z-index: 10;
        }

        .slider-item {
            transition: opacity 1s;
        }

        /* Reveal Animations */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .reveal-left {
            opacity: 0;
            transform: translateX(-50px);
            transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .reveal-left.active {
            opacity: 1;
            transform: translateX(0);
        }

        .reveal-right {
            opacity: 0;
            transform: translateX(50px);
            transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .reveal-right.active {
            opacity: 1;
            transform: translateX(0);
        }
    </style>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/favicon.png">
    <link rel="preconnect" href="https://res.cloudinary.com">
</head>

                                SNEMALNI</h1>

                                <span class="text-white">STUDIO </span>

                    <nav class="hidden lg:flex space-x-0">

        <!-- Main Content -->
        <main class="max-w-5xl mx-auto px-4 py-8">
            <div class="reveal-left mb-8">
                <h1 class="text-3xl font-bold text-white mb-2">Novice</h1>
                <div class="w-16 h-1 bg-[#EB462F] rounded-full"></div>
            </div>

            <!-- Blog Grid -->
            <div id="blog-grid" class="reveal-right grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
                <!-- Blog items will be injected here via JS -->
            </div>

            <!-- Loading State -->
            <div class="flex justify-center">
                <button id="load-more-btn"
                    class="bg-[#EB462F] hover:bg-[#C83C28] text-white font-bold py-3 px-8 rounded-full transition-all transform hover:scale-105 shadow-lg hidden">
                    Naloži več novic
                </button>
            </div>
        </main>

        <script src="js/blog-data.js"></script>
        <script>
            // Blog Logic
            const itemsPerPage = 4;
            let currentPage = parseInt(sessionStorage.getItem('novice_current_page')) || 1;
            const grid = document.getElementById('blog-grid');
            const loadMoreBtn = document.getElementById('load-more-btn');

            function createBlogCard(post) {
                const card = document.createElement('div');
                card.className = 'bg-gray-900 bg-opacity-80 backdrop-blur-sm rounded-xl overflow-hidden border border-gray-800 hover:border-[#EB462F] transition-all duration-300 group cursor-pointer';
                card.onclick = () => window.location.href = `article.html?id=${post.id}`;

                card.innerHTML = `
                    <div class="h-48 overflow-hidden relative">
                        <img src="${post.image}" alt="${post.title}" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500" loading="lazy">
                        <div class="absolute top-4 left-4">
                            <span class="bg-[#EB462F] text-white text-xs font-bold px-2 py-1 rounded shadow">${post.tags[0]}</span>
                        </div>
                    </div>
                    <div class="p-6">
                        <div class="flex items-center text-gray-400 text-xs mb-3 space-x-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                            <span>${post.date}</span>
                            <span>•</span>
                            <span>${post.readTime}</span>
                        </div>
                        <h3 class="text-xl font-bold text-white mb-2 group-hover:text-[#EB462F] transition-colors">${post.title}</h3>
                        <p class="text-gray-400 text-sm line-clamp-3">${post.excerpt}</p>
                    </div>
                `;
                return card;
            }

            function loadPosts(page, append = true) {
                if (!append) grid.innerHTML = '';

                // If we're initializing with a page > 1, load all posts up to that page
                const start = append ? (page - 1) * itemsPerPage : 0;
                const end = page * itemsPerPage;
                const postsToLoad = blogPosts.slice(start, end);

                postsToLoad.forEach(post => {
                    grid.appendChild(createBlogCard(post));
                });

                if (end < blogPosts.length) {
                    loadMoreBtn.classList.remove('hidden');
                } else {
                    loadMoreBtn.classList.add('hidden');
                }
            }

            // Init - load all posts up to current page
            loadPosts(currentPage, false);

            loadMoreBtn.onclick = () => {
                currentPage++;
                sessionStorage.setItem('novice_current_page', currentPage);
                loadPosts(currentPage);
            };
        </script>

        <!-- Footer -->

    <script>
        // Main Slider
        // Mobile menu
        document.getElementById('menu-btn').onclick = () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        };

        // Scroll Reveal Animation
        function revealOnScroll() {
            const reveals = document.querySelectorAll('.reveal, .reveal-left, .reveal-right');

            reveals.forEach(element => {
                const windowHeight = window.innerHeight;
                const elementTop = element.getBoundingClientRect().top;
                const revealPoint = 100;

                if (elementTop < windowHeight - revealPoint) {
                    element.classList.add('active');
                }
            });
        }

        window.addEventListener('scroll', revealOnScroll);
        window.addEventListener('DOMContentLoaded', revealOnScroll);
        window.addEventListener('load', revealOnScroll); // Backup for late-loading content
        revealOnScroll(); // Immediate check
    </script>
</body>
